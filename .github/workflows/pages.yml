name: Deploy Gleam site

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - gleam-blogatto-rewrite

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.0"
          rebar3-version: "3.24.0"
      - uses: gleam-lang/setup-gleam@v1.0.2
        with:
          gleam-version: "1.16.0"
      - run: gleam run -m site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
